apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tmg-crud
  namespace: openshift-gitops

spec:
  project: default

  source:
    repoURL: https://github.com/vmdeguzman/argocd.git
    targetRevision: main
    path: gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-cicd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
